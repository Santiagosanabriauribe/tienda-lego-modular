<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Tienda LEGO</title>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" style="color:white;text-decoration:none;font-size:1.1rem">Inicio</a>
            <p>Iniciar Sesion</p>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>Iniciar Sesion</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="Tu contraseña">
                </div>
                <div id="error-msg" class="error-msg hidden"></div>
                <button type="submit" class="btn-primary">Iniciar Sesion</button>
            </form>
            <p class="form-link">¿No tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
        </div>
    </main>


    <script src="csrf.js"></script>
    <script src="login.js?v=3"></script>
</body>
</html>
