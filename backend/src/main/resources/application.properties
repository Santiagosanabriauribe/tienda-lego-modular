spring.application.name=TiendaLego

# MongoDB — valor real en application-local.properties o variable de entorno
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tienda_lego}

# Server — HTTPS
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}

# JWT — valor real en application-local.properties o variable de entorno
jwt.secret=${JWT_SECRET:cambiar-en-produccion}

# Errores: no exponer detalles al exterior
server.error.include-message=never
server.error.include-stacktrace=never

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method