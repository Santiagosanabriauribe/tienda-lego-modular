spring.application.name=TiendaLego

# Secretos: activar perfil local (application-local.properties, gitignored)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# MongoDB Atlas
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/tienda_lego}

# Server — HTTPS
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_PASSWORD:changeme}

# JWT
jwt.secret=${JWT_SECRET:default-dev-secret-do-not-use-in-production-1234567890}

# Errores: no exponer detalles al exterior
server.error.include-message=never
server.error.include-stacktrace=never

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
