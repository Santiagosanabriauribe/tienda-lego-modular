<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tienda LEGO</title>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" style="color:white;text-decoration:none;font-size:1.1rem">Inicio</a>
            <p>Crear Cuenta</p>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>Crear Cuenta</h2>
            <form id="registro-form">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="text" id="email" required placeholder="tu@email.com">
                    <span id="email-error" class="field-error hidden">Usa una direccion de correo valida</span>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="Minimo 8 caracteres">
                    <span id="password-error" class="field-error hidden">No cumple con el requisito de 8 caracteres</span>
                </div>
                <div id="error-msg" class="error-msg hidden"></div>
                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
            <p class="form-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>
        </div>
    </main>


    <script src="csrf.js"></script>
    <script src="registro.js?v=3"></script>
</body>
</html>
